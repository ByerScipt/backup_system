# Installed only by the all-in-one backup-studio package: one machine serves
# itself, so the listener stays on the loopback interface. The NBKP protocol
# has no TLS and must not be reachable from the network by default.
[Service]
ExecStart=
ExecStart=/usr/bin/backup-server --config /etc/backup-studio/databackup.conf --bind 127.0.0.1
