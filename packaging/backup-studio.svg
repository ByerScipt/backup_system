<?xml version="1.0" encoding="UTF-8"?>
<!-- Backup Studio application icon: an archive tray with a downward arrow.
     Linux installs this file under hicolor/scalable/apps; the Windows
     installer uses the .ico generated by Utils/make-icons.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#1f5fd0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#background)"/>
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M60 164v28a8 8 0 0 0 8 8h120a8 8 0 0 0 8-8v-28"/>
    <path d="M128 52v64"/>
    <path d="M98 88l30 30 30-30"/>
  </g>
</svg>
