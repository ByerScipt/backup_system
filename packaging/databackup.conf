[server]
# Written for the packaged service, which runs with
# WorkingDirectory=/var/lib/backup-studio and a dedicated account; the same
# file works inside the container image, where the working directory is /data.
# The all-in-one package restricts the listener to 127.0.0.1 with the systemd
# drop-in; this file keeps the shared-server default.
bind_address = 0.0.0.0
port = 8848
storage_path = server_data
max_connections = 32
timeout_seconds = 30
